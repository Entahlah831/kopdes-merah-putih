name: Kopdes Merah Putih CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  config-and-static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Validasi Konfigurasi & Konflik Port (Set A & Set B)
        run: |
          go run ./cmd/envcheck --strict --ports --no-listen --env-file .env.test
          go run ./cmd/envcheck --strict --ports --no-listen --env-file .env.test.alt
          go run ./cmd/envcheck --compare .env.test .env.test.alt

      - name: Validasi Sintaks Docker Compose & Penolakan .env.example Kosong
        run: |
          if go run ./cmd/envcheck --strict --env-file .env.example >/dev/null 2>&1; then
            echo "ERROR: .env.example seharusnya gagal strict check karena secret wajib kosong!"
            exit 1
          fi
          docker compose --env-file .env.test config --quiet
          docker compose --env-file .env.test.alt config --quiet
          docker compose -f docker-compose.test.yml --env-file .env.test config --quiet
          docker compose -f docker-compose.test.yml --env-file .env.test.alt config --quiet

      - name: Hadolint Audit Dockerfile
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /tmp/hadolint
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile

      - name: Trivy Config & Filesystem Scan
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          sudo tar -xz -C /usr/local/bin -f /tmp/trivy.tar.gz trivy
          rm -f /tmp/trivy.tar.gz
          trivy config --severity HIGH,CRITICAL --exit-code 1 .

      - name: Gitleaks Secret Scanning
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --verbose --redact

  test-and-security-setA:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kopdes_test_setA_pass_123!
          POSTGRES_DB: kopdes_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Inisialisasi Database Set A (kopdes_test)
        env:
          PGPASSWORD: kopdes_test_setA_pass_123!
          APP_ENV: test
          KOPDES_APP_PASSWORD: kopdes_test_setA_pass_123!
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d kopdes_test -v ON_ERROR_STOP=1 -f db/docker-init/01_roles.sql
          for file in $(ls db/migrations/*_*.up.sql | sort -V); do
            psql -h 127.0.0.1 -p 5433 -U postgres -d kopdes_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Jalankan Full Suite -race (Set A)
        env:
          TEST_ENV_FILE: .env.test
        run: go test -count=1 -race -p 1 ./...

      - name: Pemindaian Keamanan Go (govulncheck, staticcheck, gosec)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/staticcheck" ./...
          # G505/G115 di internal/security/totp.go (SHA-1 RFC 6238 & uint64 unix) berada di folder terkunci AGENTS.md
          "$(go env GOPATH)/bin/gosec" -exclude=G104,G304,G101,G505,G115 ./...

  docker-setB-e2e-and-load:
    runs-on: ubuntu-latest
    needs: [config-and-static-audit]
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Boot Stack Set B dari Nol (Port Non-Standar 18080/15433/19100)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          while IFS= read -r _line || [ -n "${_line}" ]; do
            _line="${_line%$'\r'}"
            [[ -z "${_line}" || "${_line}" == \#* ]] && continue
            if [[ "${_line}" == *=* ]]; then
              _k="${_line%%=*}"
              _v="${_line#*=}"
              export "${_k}=${_v}"
            fi
          done < .env.test.alt
          docker compose -f docker-compose.test.yml --env-file .env.test.alt up -d --build
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${API_HOST_PORT}/readyz" >/dev/null; then
              echo "Set B API siap pada port ${API_HOST_PORT}"
              READY=1
              break
            fi
            sleep 3
          done
          test "${READY}" = "1"
          curl -fsS "http://127.0.0.1:${API_HOST_PORT}/readyz"
          STATUS_NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${METRICS_HOST_PORT}/metrics")
          test "${STATUS_NOAUTH}" = "401"
          METRICS_OUT=$(curl -fsS -H "Authorization: Bearer ${METRICS_TOKEN}" "http://127.0.0.1:${METRICS_HOST_PORT}/metrics")
          printf '%s\n' "${METRICS_OUT}" | head -n 10 || true

      - name: Jalankan Full Suite -race & Restore Drill & Load Test 2000 Anggota pada Set B
        run: |
          while IFS= read -r _line || [ -n "${_line}" ]; do
            _line="${_line%$'\r'}"
            [[ -z "${_line}" || "${_line}" == \#* ]] && continue
            if [[ "${_line}" == *=* ]]; then
              _k="${_line%%=*}"
              _v="${_line#*=}"
              export "${_k}=${_v}"
            fi
          done < .env.test.alt
          go test -count=1 -race -p 1 ./...
          ENV_FILE=.env.test.alt bash scripts/backup.sh
          ENV_FILE=.env.test.alt bash scripts/restore_drill.sh
          go run ./cmd/loadtest --base-url "http://127.0.0.1:${API_HOST_PORT}" --members 2000 --concurrency 100

      - name: Bersihkan Container Set B
        if: always()
        run: docker compose -f docker-compose.test.yml --env-file .env.test.alt down -v
