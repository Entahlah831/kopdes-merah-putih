name: CI Kopdes Merah Putih (Lean Backend)

on:
  push:
    branches: [main, lean-revamp, decision-audit, modular-and-wireframe]
  pull_request:
    branches: [main, lean-revamp, decision-audit, modular-and-wireframe]

permissions:
  contents: read

jobs:
  env-sqlc-and-secrets:
    name: Validasi Env (51 Var), sqlc, & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install sqlc & gitleaks
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Validasi Konfigurasi Uji Set A & Set B + Paritas Kunci
        run: |
          go run ./cmd/envcheck --strict --ports --no-listen --env-file .env.test
          go run ./cmd/envcheck --strict --ports --no-listen --env-file .env.test.alt
          go run ./cmd/envcheck --compare .env.test .env.test.alt

      - name: Verifikasi sqlc generate bebas drift
        run: |
          sqlc generate
          git diff --exit-code internal/db

      - name: Pindai Secret dengan Gitleaks
        run: gitleaks git --config .gitleaks.toml --verbose --redact

  test-build-and-security:
    name: Build, Vet, Race Test (Set A & Set B), Backup Age Drill, & SAST
    runs-on: ubuntu-latest
    services:
      postgres_set_a:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kopdes_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kopdes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres_set_b:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kopdes_alt_test
        ports:
          - 15433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kopdes_alt_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL client, age, & Go security linters
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client age
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Inisialisasi Seluruh Migrasi (21 Tabel) & Role Non-Superuser kopdes_app (Set A & Set B)
        run: |
          set -euo pipefail
          for envfile in .env.test .env.test.alt; do
            set -a
            source "$envfile"
            set +a
            PGUSER=postgres PGHOST=127.0.0.1 PGPORT="$DB_PORT" psql -v ON_ERROR_STOP=1 -d "$DB_NAME" -f db/docker-init/01_roles.sql
            for mf in $(ls db/migrations/*_*.up.sql | sort); do
              PGUSER=postgres PGHOST=127.0.0.1 PGPORT="$DB_PORT" psql -v ON_ERROR_STOP=1 -d "$DB_NAME" -f "$mf"
            done
            PGUSER=postgres PGHOST=127.0.0.1 PGPORT="$DB_PORT" psql -v ON_ERROR_STOP=1 -d "$DB_NAME" -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO kopdes_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO kopdes_app; GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO kopdes_app;"
          done

      - name: Build & Vet
        run: |
          go build ./...
          go build ./cmd/kopdes
          go vet ./...

      - name: Tes Batas Arsitektur Modular Monolith
        run: go test -count=1 ./internal -run TestArchitecture

      - name: Jalankan Full Race Test Suite (Semua Paket Termasuk internal/db & internal/worker)
        run: go test -count=1 -race -p 1 ./...

      - name: Smoke Test Seeder, CLI Admin/Storage, & Worker Kopdes
        run: |
          go run ./cmd/seed_test_accounts --env-file .env.test
          go run ./cmd/kopdes --env-file .env.test worker --once
          go run ./cmd/kopdes --env-file .env.test storage migrate-files
          go run ./cmd/kopdes --env-file .env.test pdp purge
          go run ./cmd/kopdes --env-file .env.test bukti purge

      - name: Uji Backup Terautentikasi (age) + Tamper Rejection + Restore Drill
        run: |
          set -euo pipefail
          KEYFILE=$(mktemp)
          age-keygen -o "$KEYFILE" 2>/dev/null
          PUB=$(grep '^# public key: ' "$KEYFILE" | awk '{print $4}')
          mkdir -p ./storage/kyc_test_setA ./storage/bukti_test_setA
          echo "dummy-enc-kyc" > ./storage/kyc_test_setA/ci-sample.enc
          echo "dummy-enc-bukti" > ./storage/bukti_test_setA/ci-sample.enc
          ENV_FILE=.env.test PGUSER=postgres PGPASSWORD="" BACKUP_AGE_RECIPIENT="$PUB" bash scripts/backup.sh
          ENV_FILE=.env.test PGUSER=postgres PGPASSWORD="" BACKUP_AGE_IDENTITY_FILE="$KEYFILE" bash scripts/restore_test.sh
          ENV_FILE=.env.test PGUSER=postgres PGPASSWORD="" BACKUP_AGE_RECIPIENT="$PUB" BACKUP_AGE_IDENTITY_FILE="$KEYFILE" bash scripts/restore_drill.sh
          rm -rf "$KEYFILE" ./backups ./storage/kyc_test_setA ./storage/bukti_test_setA

      - name: SAST & Vulnerability Check
        run: |
          staticcheck ./...
          gosec ./...
          govulncheck ./...

  frontend-wireframe-build:
    name: Build & Typecheck Frontend Wireframe (Vite + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-wireframe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-wireframe/package-lock.json
      - name: Install & Verifikasi TypeScript + Build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
