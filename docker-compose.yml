networks:
  kopdes_internal:
    driver: bridge
  kopdes_edge:
    driver: bridge

volumes:
  pg_data:
  kyc_storage:
  bukti_storage:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "port=${DB_PORT:?DB_PORT wajib disetel}"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_DB: ${DB_NAME:?DB_NAME wajib disetel}
      POSTGRES_USER: kopdes_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib disetel}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?DB_HOST_PORT wajib disetel}:${DB_PORT:?DB_PORT wajib disetel}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/docker-init:/docker-entrypoint-initdb.d:ro
      - ./backend/db/migrations:/docker-migrations:ro
    networks:
      - kopdes_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopdes_migrator -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: "1.0"
    mem_limit: 512m

  api:
    profiles: ["app", "tester", "proxy"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      API_PORT: ${API_PORT:?API_PORT wajib disetel}
      API_HOST_PORT: ${API_HOST_PORT:?API_HOST_PORT wajib disetel}
      UI_PORT: ${UI_PORT:?UI_PORT wajib disetel}
      WORKER_PORT: ${WORKER_PORT:?WORKER_PORT wajib disetel}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS wajib disetel}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-30}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:?DB_PORT wajib disetel}
      DB_HOST_PORT: ${DB_HOST_PORT:?DB_HOST_PORT wajib disetel}
      DB_NAME: ${DB_NAME:?DB_NAME wajib disetel}
      DB_USER: ${DB_USER:-kopdes_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AES_MASTER_KEY: ${AES_MASTER_KEY:?AES_MASTER_KEY wajib disetel}
      AES_PREVIOUS_KEYS: ${AES_PREVIOUS_KEYS:-}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET wajib disetel}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-30m}
      SESSION_ABS_TTL: ${SESSION_ABS_TTL:-12h}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOW_BEARER_AUTH: ${ALLOW_BEARER_AUTH:-false}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-admin,bendahara}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      ALLOW_PERSONAL_PAYMENT_PILOT: ${ALLOW_PERSONAL_PAYMENT_PILOT:-false}
      PILOT_MAX_PER_TX: ${PILOT_MAX_PER_TX:-500000}
      PILOT_MAX_PER_DAY: ${PILOT_MAX_PER_DAY:-2000000}
      QRIS_UNIQUE_DIGITS: ${QRIS_UNIQUE_DIGITS:-3}
      PAYMENT_EXPIRY_DURATION: ${PAYMENT_EXPIRY_DURATION:-15m}
      STOCK_HOLD_MINUTES: ${STOCK_HOLD_MINUTES:-60}
      DUAL_CONTROL_BREAKGLASS_ENABLED: ${DUAL_CONTROL_BREAKGLASS_ENABLED:-false}
      PDP_REJECTED_RETENTION_DAYS: ${PDP_REJECTED_RETENTION_DAYS:-30}
      STORAGE_KYC_DIR: /app/storage/kyc
      STORAGE_BUKTI_DIR: /app/storage/bukti
      BUKTI_RETENTION_DAYS: ${BUKTI_RETENTION_DAYS:-365}
      BACKUP_DIR: ${BACKUP_DIR:-./backups}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    ports:
      - "${API_HOST_PORT:?API_HOST_PORT wajib disetel}:${API_PORT:?API_PORT wajib disetel}"
    volumes:
      - kyc_storage:/app/storage/kyc
      - bukti_storage:/app/storage/bukti
    networks:
      - kopdes_internal
      - kopdes_edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${API_PORT}/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 512m

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/kopdes"]
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${WORKER_PORT:?WORKER_PORT wajib disetel}/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      API_PORT: ${API_PORT:?API_PORT wajib disetel}
      API_HOST_PORT: ${API_HOST_PORT:?API_HOST_PORT wajib disetel}
      UI_PORT: ${UI_PORT:?UI_PORT wajib disetel}
      WORKER_PORT: ${WORKER_PORT:?WORKER_PORT wajib disetel}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS wajib disetel}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:?DB_PORT wajib disetel}
      DB_HOST_PORT: ${DB_HOST_PORT:?DB_HOST_PORT wajib disetel}
      DB_NAME: ${DB_NAME:?DB_NAME wajib disetel}
      DB_USER: ${DB_USER:-kopdes_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AES_MASTER_KEY: ${AES_MASTER_KEY:?AES_MASTER_KEY wajib disetel}
      AES_PREVIOUS_KEYS: ${AES_PREVIOUS_KEYS:-}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET wajib disetel}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-30m}
      SESSION_ABS_TTL: ${SESSION_ABS_TTL:-12h}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOW_BEARER_AUTH: ${ALLOW_BEARER_AUTH:-false}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-admin,bendahara}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      ALLOW_PERSONAL_PAYMENT_PILOT: ${ALLOW_PERSONAL_PAYMENT_PILOT:-false}
      PILOT_MAX_PER_TX: ${PILOT_MAX_PER_TX:-500000}
      PILOT_MAX_PER_DAY: ${PILOT_MAX_PER_DAY:-2000000}
      QRIS_UNIQUE_DIGITS: ${QRIS_UNIQUE_DIGITS:-3}
      PAYMENT_EXPIRY_DURATION: ${PAYMENT_EXPIRY_DURATION:-15m}
      STOCK_HOLD_MINUTES: ${STOCK_HOLD_MINUTES:-60}
      DUAL_CONTROL_BREAKGLASS_ENABLED: ${DUAL_CONTROL_BREAKGLASS_ENABLED:-false}
      PDP_REJECTED_RETENTION_DAYS: ${PDP_REJECTED_RETENTION_DAYS:-30}
      STORAGE_KYC_DIR: /app/storage/kyc
      STORAGE_BUKTI_DIR: /app/storage/bukti
      BUKTI_RETENTION_DAYS: ${BUKTI_RETENTION_DAYS:-365}
      BACKUP_DIR: ${BACKUP_DIR:-./backups}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - kyc_storage:/app/storage/kyc
      - bukti_storage:/app/storage/bukti
    networks:
      - kopdes_internal
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 256m

  tester:
    profiles: ["tester"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/app/kopdes"]
    command: ["uiserve", "-bind", "0.0.0.0", "-ui-dir", "/app/frontend/tester", "-api-url", "http://127.0.0.1:${API_HOST_PORT:?API_HOST_PORT wajib disetel}"]
    environment:
      APP_ENV: ${APP_ENV:-test}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      UI_PORT: ${UI_PORT:?UI_PORT wajib disetel}
      API_PORT: ${API_PORT:?API_PORT wajib disetel}
      API_HOST_PORT: ${API_HOST_PORT:?API_HOST_PORT wajib disetel}
      WORKER_PORT: ${WORKER_PORT:?WORKER_PORT wajib disetel}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS wajib disetel}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:?DB_PORT wajib disetel}
      DB_HOST_PORT: ${DB_HOST_PORT:?DB_HOST_PORT wajib disetel}
      DB_NAME: ${DB_NAME:?DB_NAME wajib disetel}
      DB_USER: ${DB_USER:-kopdes_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      AES_MASTER_KEY: ${AES_MASTER_KEY:?AES_MASTER_KEY wajib disetel}
      AES_PREVIOUS_KEYS: ${AES_PREVIOUS_KEYS:-}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET wajib disetel}
    ports:
      - "127.0.0.1:${UI_PORT:?UI_PORT wajib disetel}:${UI_PORT:?UI_PORT wajib disetel}"
    networks:
      - kopdes_internal
    security_opt:
      - no-new-privileges:true
    cpus: "0.25"
    mem_limit: 128m

  proxy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:?API_PORT wajib disetel}
      KOPDES_SITE_ADDRESS: ${KOPDES_SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/wireframe/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kopdes_edge
      - kopdes_internal
    security_opt:
      - no-new-privileges:true
    cpus: "0.25"
    mem_limit: 128m
