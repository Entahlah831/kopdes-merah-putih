services:
  # ============================================================================
  # 1. DATABASE POSTGRESQL 16 (Multi-Tenant & Row Level Security)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kopdes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kopdes_db}
      # Inisialisasi awal menggunakan user administratif sementara (bukan user aplikasi)
      POSTGRES_USER: ${POSTGRES_INIT_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_INIT_PASSWORD}
      KOPDES_APP_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV:-production}
    ports:
      # K1: Batasi port PostgreSQL pada host ke 127.0.0.1 (mencegah akses terbuka dari luar)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - kopdes_pgdata:/var/lib/postgresql/data
      # Inisialisasi role kopdes_app non-superuser dan eksekusi seluruh migrasi berurutan
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INIT_USER:-postgres} -d ${DB_NAME:-kopdes_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kopdes_net

  # ============================================================================
  # 2. BACKEND API KOPDES MERAH PUTIH (Golang High-Performance API)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kopdes_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${APP_PORT:-8080}
      APP_PORT: ${APP_PORT:-8080}
      # K1: API berjalan menggunakan role kopdes_app (NOSUPERUSER, NOBYPASSRLS)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-kopdes_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-kopdes_db}
      DB_SSLMODE: disable
      DATABASE_URL: postgres://${DB_USER:-kopdes_app}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kopdes_db}?sslmode=disable
      # Kunci kriptografi dari file .env
      JWT_SECRET: ${JWT_SECRET}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET}
      AES_MASTER_KEY: ${AES_MASTER_KEY}
      QRIS_SECRET: ${QRIS_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      # Kebijakan CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-30}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-60}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kopdes_net

networks:
  kopdes_net:
    driver: bridge

volumes:
  kopdes_pgdata:
    driver: local
