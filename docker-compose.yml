networks:
  kopdes_internal:
    driver: bridge
  kopdes_edge:
    driver: bridge

volumes:
  pg_data:
  kyc_storage:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "port=${DB_PORT:?DB_PORT wajib disetel}"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_DB: ${DB_NAME:?DB_NAME wajib disetel}
      POSTGRES_USER: kopdes_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib disetel}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?DB_HOST_PORT wajib disetel}:${DB_PORT:?DB_PORT wajib disetel}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-migrations:ro
    networks:
      - kopdes_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopdes_migrator -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: "1.0"
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      API_PORT: ${API_PORT:?API_PORT wajib disetel}
      API_HOST_PORT: ${API_HOST_PORT:?API_HOST_PORT wajib disetel}
      UI_PORT: ${UI_PORT:?UI_PORT wajib disetel}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS wajib disetel}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:?DB_PORT wajib disetel}
      DB_HOST_PORT: ${DB_HOST_PORT:?DB_HOST_PORT wajib disetel}
      DB_NAME: ${DB_NAME:?DB_NAME wajib disetel}
      DB_USER: ${DB_USER:-kopdes_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib disetel}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AES_MASTER_KEY: ${AES_MASTER_KEY:?AES_MASTER_KEY wajib disetel}
      AES_PREVIOUS_KEYS: ${AES_PREVIOUS_KEYS:-}
      BLIND_INDEX_SECRET: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET wajib disetel}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-30m}
      SESSION_ABS_TTL: ${SESSION_ABS_TTL:-12h}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-admin,bendahara}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_DURATION: ${LOGIN_LOCKOUT_DURATION:-15m}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      ALLOW_PERSONAL_PAYMENT_PILOT: ${ALLOW_PERSONAL_PAYMENT_PILOT:-false}
      PILOT_MAX_PER_TX: ${PILOT_MAX_PER_TX:-500000}
      PILOT_MAX_PER_DAY: ${PILOT_MAX_PER_DAY:-2000000}
      QRIS_UNIQUE_DIGITS: ${QRIS_UNIQUE_DIGITS:-3}
      PAYMENT_EXPIRY_DURATION: ${PAYMENT_EXPIRY_DURATION:-24h}
      PENDING_LIMIT_PER_MEMBER: ${PENDING_LIMIT_PER_MEMBER:-3}
      PENDING_LIMIT_GLOBAL: ${PENDING_LIMIT_GLOBAL:-200}
      PDP_REJECTED_RETENTION_DAYS: ${PDP_REJECTED_RETENTION_DAYS:-30}
      STORAGE_KYC_DIR: /app/storage/kyc
      BACKUP_DIR: ${BACKUP_DIR:-./backups}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    ports:
      - "${API_HOST_PORT:?API_HOST_PORT wajib disetel}:${API_PORT:?API_PORT wajib disetel}"
    volumes:
      - kyc_storage:/app/storage/kyc
    networks:
      - kopdes_internal
      - kopdes_edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${API_PORT}/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 512m
