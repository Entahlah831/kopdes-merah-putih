openapi: 3.0.3
x-source: openapi.json
info:
  title: API Kopdes Merah Putih (Backend Ramping)
  version: 2.0.0-lean
  description: 'Spesifikasi OpenAPI 3.0.3 untuk Backend Ramping Kopdes Merah Putih
    (1 koperasi tunggal, 19 tabel PostgreSQL 16, 35 endpoint HTTP).

    Autentikasi menggunakan opaque session token (Authorization: Bearer atau cookie
    kopdes_session) + MFA TOTP wajib untuk admin & bendahara.

    Catatan hukum/akuntansi: masa retensi 30 hari data pendaftaran ditolak ditandai
    PERLU VERIFIKASI HUKUM; klasifikasi iuran ditandai KEPUTUSAN AKUNTAN.

    '
servers:
- url: http://{host}:{port}
  description: Diisi dari konfigurasi lingkungan (API_PORT / /config.json; jangan
    hardcode)
  variables:
    host:
      default: 127.0.0.1
    port:
      default: '{API_PORT}'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque session token dari POST /api/v1/auth/login
  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        meta:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
paths:
  /healthz:
    get:
      tags:
      - Publik & Kesehatan
      operationId: getHealthz
      summary: Liveness probe API
      responses:
        '200':
          description: Server hidup
  /readyz:
    get:
      tags:
      - Publik & Kesehatan
      operationId: getReadyz
      summary: Readiness probe + ping PostgreSQL
      responses:
        '200':
          description: Siap
        '503':
          description: DB tidak siap
  /api/v1/public/config:
    get:
      tags:
      - Publik & Kesehatan
      operationId: getPublicConfig
      summary: Konfigurasi publik koperasi, batas unggahan, feature flags, dan QRIS
        aktif
      responses:
        '200':
          description: Konfigurasi non-rahasia
  /api/v1/public/pendaftaran:
    post:
      tags:
      - Pendaftaran Publik & KYC
      operationId: postPublicPendaftaran
      summary: Ajukan pendaftaran calon anggota baru + token unggah KYC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nama_lengkap
              - email
              - nik
              - no_hp
              - tanggal_lahir
              - alamat
              - pekerjaan
              properties:
                nama_lengkap:
                  type: string
                email:
                  type: string
                  format: email
                nik:
                  type: string
                no_hp:
                  type: string
                tanggal_lahir:
                  type: string
                  example: '1995-05-12'
                alamat:
                  type: string
                pekerjaan:
                  type: string
                captcha_token:
                  type: string
      responses:
        '201':
          description: Pendaftaran diterima beserta upload_token
        '409':
          description: Duplikat email/NIK/HP
  /api/v1/public/pendaftaran/{id}/dokumen:
    post:
      tags:
      - Pendaftaran Publik & KYC
      operationId: postUploadDokumenKYC
      summary: Unggah berkas KYC terenkripsi (multipart) memakai header X-Upload-Token
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Upload-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - tipe_dokumen
              - file
              properties:
                tipe_dokumen:
                  type: string
                  enum:
                  - ktp
                  - selfie_ktp
                  - kk
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Berkas tersimpan terenkripsi (.enc)
        '401':
          description: X-Upload-Token tidak sah
  /api/v1/auth/login:
    post:
      tags:
      - Autentikasi & Sesi
      operationId: postAuthLogin
      summary: Login dengan email/no_hp dan password; mengembalikan opaque session_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              - password
              properties:
                identifier:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session token aktif atau mfa_pending
        '429':
          description: Terkunci sementara
  /api/v1/auth/mfa/setup:
    post:
      tags:
      - Autentikasi & Sesi
      operationId: postAuthMFASetup
      summary: 'Dua langkah enrollment TOTP MFA: kirim {} untuk mendapat secret +
        setup_token, lalu kirim {setup_token, code} untuk aktivasi'
      security:
      - bearerSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: secret/setup_token (awal) atau mfa_enabled=true + recovery_codes
            (konfirmasi)
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - Autentikasi & Sesi
      operationId: postAuthMFAVerify
      summary: Verifikasi kode TOTP atau recovery_code pada akun yang sudah mengaktifkan
        MFA
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                recovery_code:
                  type: string
      responses:
        '200':
          description: MFA terverifikasi; scope=full
        '401':
          description: Kode salah atau replay TOTP
  /api/v1/auth/logout:
    post:
      tags:
      - Autentikasi & Sesi
      operationId: postAuthLogout
      summary: Cabut sesi aktif saat ini
      security:
      - bearerSession: []
      responses:
        '200':
          description: Sesi dicabut
  /api/v1/auth/password:
    post:
      tags:
      - Autentikasi & Sesi
      operationId: postAuthPassword
      summary: Aktivasi kata sandi dengan activation/reset code atau ubah sandi sesi
        aktif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_password
              properties:
                code:
                  type: string
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Kata sandi diperbarui
  /api/v1/auth/me:
    get:
      tags:
      - Autentikasi & Sesi
      operationId: getAuthMe
      summary: Profil sesi dan peran pengguna aktif
      security:
      - bearerSession: []
      responses:
        '200':
          description: Data pengguna aktif
  /api/v1/pengaturan:
    put:
      tags:
      - Pengaturan & Pengguna
      operationId: putPengaturan
      summary: Perbarui profil koperasi tunggal, ongkir tetap, digit unik QRIS, dan
        QRIS aktif (admin)
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama_koperasi:
                  type: string
                alamat_koperasi:
                  type: string
                telepon_koperasi:
                  type: string
                qris_unique_digits:
                  type: integer
                  enum:
                  - 3
                  - 4
                ongkir_tetap:
                  type: integer
                kebijakan_teks:
                  type: string
                active_rekening_qris_id:
                  type: string
      responses:
        '200':
          description: Pengaturan diperbarui
  /api/v1/users:
    get:
      tags:
      - Pengaturan & Pengguna
      operationId: getUsers
      summary: Daftar akun pengguna internal & anggota (admin)
      security:
      - bearerSession: []
      responses:
        '200':
          description: Daftar pengguna
    post:
      tags:
      - Pengaturan & Pengguna
      operationId: postUsers
      summary: Buat akun pengguna baru (admin)
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - no_hp
              - nama_lengkap
              - peran
              - password
              properties:
                email:
                  type: string
                no_hp:
                  type: string
                nama_lengkap:
                  type: string
                peran:
                  type: string
                  enum:
                  - admin
                  - bendahara
                  - petugas_toko
                  - anggota
                password:
                  type: string
      responses:
        '201':
          description: Pengguna dibuat
  /api/v1/users/{id}:
    patch:
      tags:
      - Pengaturan & Pengguna
      operationId: patchUserByID
      summary: Ubah peran, aktif/nonaktif, reset MFA, atau terbitkan kode reset sandi
        (admin)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peran:
                  type: string
                status_aktif:
                  type: boolean
                reset_mfa:
                  type: boolean
                issue_reset_code:
                  type: boolean
      responses:
        '200':
          description: Pengguna diperbarui
  /api/v1/pendaftaran:
    get:
      tags:
      - Verifikasi Pendaftaran & KYC
      operationId: getPendaftaran
      summary: Daftar pendaftaran calon anggota (admin)
      security:
      - bearerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Daftar pendaftaran
  /api/v1/pendaftaran/{id}/verifikasi:
    post:
      tags:
      - Verifikasi Pendaftaran & KYC
      operationId: postVerifikasiPendaftaran
      summary: Setujui, minta perbaikan, atau tolak pendaftaran (admin)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - keputusan
              properties:
                keputusan:
                  type: string
                  enum:
                  - disetujui
                  - ditolak
                  - perlu_perbaikan
                catatan:
                  type: string
      responses:
        '200':
          description: Hasil verifikasi & activation_code bila disetujui
  /api/v1/pendaftaran/{id}/dokumen/{tipe}:
    get:
      tags:
      - Verifikasi Pendaftaran & KYC
      operationId: getDokumenKYC
      summary: Unduh dan dekripsi dokumen KYC (admin)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tipe
        in: path
        required: true
        schema:
          type: string
          enum:
          - ktp
          - selfie_ktp
          - kk
      responses:
        '200':
          description: Gambar terdekripsi
  /api/v1/anggota:
    get:
      tags:
      - Anggota
      operationId: getAnggotaList
      summary: Daftar anggota JSON atau CSV terproteksi formula injection (staf)
      security:
      - bearerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: format
        in: query
        schema:
          type: string
          enum:
          - csv
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Daftar anggota
  /api/v1/anggota/{id}:
    get:
      tags:
      - Anggota
      operationId: getAnggotaByID
      summary: Detail anggota; ?unmask=true hanya untuk admin & diaudit
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: unmask
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Detail anggota
  /api/v1/anggota/{id}/status:
    patch:
      tags:
      - Anggota
      operationId: patchAnggotaStatus
      summary: Ubah status anggota (aktif/nonaktif); menonaktifkan langsung mencabut
        semua sesi user (admin)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - alasan
              properties:
                status:
                  type: string
                  enum:
                  - aktif
                  - nonaktif
                alasan:
                  type: string
      responses:
        '200':
          description: Status diperbarui
  /api/v1/anggota/impor:
    post:
      tags:
      - Anggota
      operationId: postAnggotaImpor
      summary: Impor massal anggota via teks CSV (mendukung ?dry_run=true)
      security:
      - bearerSession: []
      parameters:
      - name: dry_run
        in: query
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - csv
              properties:
                csv:
                  type: string
      responses:
        '200':
          description: Ringkasan impor
  /api/v1/iuran/jenis:
    post:
      tags:
      - Iuran Bulanan
      operationId: postIuranJenisOrGenerate
      summary: Buat jenis iuran baru atau action=generate tagihan bulanan periode
        YYYY-MM
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - generate
                periode:
                  type: string
                  example: 2026-12
                kode:
                  type: string
                nama:
                  type: string
                nominal:
                  type: integer
                hari_jatuh_tempo:
                  type: integer
                klasifikasi_akuntansi:
                  type: string
                  description: KEPUTUSAN AKUNTAN
      responses:
        '201':
          description: Jenis dibuat
        '200':
          description: Hasil generate tagihan
  /api/v1/iuran/tagihan:
    get:
      tags:
      - Iuran Bulanan
      operationId: getIuranTagihan
      summary: Daftar tagihan iuran (atau ?scope=jenis untuk daftar jenis iuran aktif)
      security:
      - bearerSession: []
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - saya
          - tunggakan
          - jenis
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Daftar tagihan atau jenis
  /api/v1/iuran/tagihan/{id}/keringanan:
    patch:
      tags:
      - Iuran Bulanan
      operationId: patchIuranKeringanan
      summary: Terapkan keringanan/pembebasan nominal pada tagihan iuran (admin/bendahara)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nominal_keringanan
              - alasan
              properties:
                nominal_keringanan:
                  type: integer
                alasan:
                  type: string
      responses:
        '200':
          description: Keringanan diterapkan
  /api/v1/katalog/produk:
    get:
      tags:
      - E-Katalog & Promo
      operationId: getKatalogProduk
      summary: Daftar produk, ?tab=kategori, atau ?tab=promo dengan kalkulasi tier
        harga anggota/umum
      parameters:
      - name: tab
        in: query
        schema:
          type: string
          enum:
          - kategori
          - promo
      - name: q
        in: query
        schema:
          type: string
      - name: kategori_id
        in: query
        schema:
          type: string
      - name: include_nonaktif
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Daftar produk/kategori/promo
    post:
      tags:
      - E-Katalog & Promo
      operationId: postKatalogProduk
      summary: Buat/ubah produk, kategori (action=create_kategori), atau promo (action=create_promo)
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - create_kategori
                  - create_promo
                  - update_produk
                id:
                  type: string
                kategori_id:
                  type: string
                sku:
                  type: string
                nama:
                  type: string
                slug:
                  type: string
                deskripsi:
                  type: string
                satuan:
                  type: string
                harga_umum:
                  type: integer
                harga_anggota:
                  type: integer
                stok:
                  type: integer
                status:
                  type: string
      responses:
        '201':
          description: Item katalog dibuat
        '200':
          description: Produk diperbarui
  /api/v1/toko/checkout:
    post:
      tags:
      - Toko, Pesanan & Pengantaran
      operationId: postTokoCheckout
      summary: Checkout langsung tanpa keranjang server; idempoten dengan Idempotency-Key
      security:
      - bearerSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - metode_pengiriman
              - metode_pembayaran
              - nama_penerima
              - hp_penerima
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      produk_id:
                        type: string
                      kuantitas:
                        type: integer
                metode_pengiriman:
                  type: string
                  enum:
                  - ambil_di_koperasi
                  - diantar
                metode_pembayaran:
                  type: string
                  enum:
                  - qris
                  - tunai
                nama_penerima:
                  type: string
                hp_penerima:
                  type: string
                alamat_pengantaran:
                  type: string
                kode_promo:
                  type: string
                catatan:
                  type: string
                tanggal_antar:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Pesanan dibuat
        '200':
          description: Replay idempoten
        '409':
          description: Stok kurang / produk tanpa harga aktif
  /api/v1/pesanan:
    get:
      tags:
      - Toko, Pesanan & Pengantaran
      operationId: getPesanan
      summary: Daftar pesanan atau detail (?id=uuid)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Daftar/detail pesanan
  /api/v1/pesanan/{id}/status:
    patch:
      tags:
      - Toko, Pesanan & Pengantaran
      operationId: patchPesananStatus
      summary: Perbarui status pesanan (diproses, diantar, siap_diambil, selesai,
        batal)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                catatan:
                  type: string
      responses:
        '200':
          description: Status diperbarui
  /api/v1/pesanan/daftar-antar:
    get:
      tags:
      - Toko, Pesanan & Pengantaran
      operationId: getPesananDaftarAntar
      summary: Daftar antaran siap kirim + label antar teks (?format=csv untuk ekspor)
      security:
      - bearerSession: []
      parameters:
      - name: tanggal
        in: query
        schema:
          type: string
          example: '2026-11-15'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - csv
      responses:
        '200':
          description: Daftar antaran
  /api/v1/pembayaran:
    get:
      tags:
      - Pembayaran QRIS/Tunai & Dual Control
      operationId: getPembayaran
      summary: Daftar pembayaran, detail (?id=), daftar rekening QRIS (?rekening=true),
        atau unduh bukti (?bukti_id=)
      security:
      - bearerSession: []
      parameters:
      - name: rekening
        in: query
        schema:
          type: boolean
      - name: id
        in: query
        schema:
          type: string
          format: uuid
      - name: bukti_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Data pembayaran / rekening / berkas bukti
    post:
      tags:
      - Pembayaran QRIS/Tunai & Dual Control
      operationId: postPembayaran
      summary: 'JSON: buat instruksi bayar (atau action=create_rekening). Multipart:
        unggah bukti bayar'
      security:
      - bearerSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jenis_transaksi:
                  type: string
                  enum:
                  - iuran
                  - pesanan
                metode:
                  type: string
                  enum:
                  - qris
                  - tunai
                tagihan_ids:
                  type: array
                  items:
                    type: string
                pesanan_id:
                  type: string
                catatan_pembayar:
                  type: string
                action:
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
              - pembayaran_id
              - file
              properties:
                pembayaran_id:
                  type: string
                catatan_pembayar:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Instruksi pembayaran dibuat
        '200':
          description: Replay / bukti diunggah
        '409':
          description: Bukti duplikat (SHA-256) atau limit pending
  /api/v1/pembayaran/{id}/verifikasi:
    post:
      tags:
      - Pembayaran QRIS/Tunai & Dual Control
      operationId: postVerifikasiPembayaran
      summary: Verifikasi pembayaran dengan penegakan dual-control (pembuat != verifikator)
      security:
      - bearerSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - keputusan
              - nominal_dibayar
              properties:
                keputusan:
                  type: string
                  enum:
                  - setuju
                  - tolak
                nominal_dibayar:
                  type: integer
                alasan:
                  type: string
                selesaikan_tindak_lanjut:
                  type: boolean
      responses:
        '200':
          description: Pembayaran diverifikasi
        '403':
          description: Pelanggaran dual-control atau bukan admin/bendahara
  /api/v1/laporan:
    get:
      tags:
      - Laporan
      operationId: getLaporan
      summary: Laporan operasional anggota, tunggakan, penjualan, atau pembayaran
        (?format=csv)
      security:
      - bearerSession: []
      parameters:
      - name: jenis
        in: query
        schema:
          type: string
          enum:
          - anggota
          - tunggakan
          - penjualan
          - pembayaran
      - name: dari
        in: query
        schema:
          type: string
      - name: sampai
        in: query
        schema:
          type: string
      - name: format
        in: query
        schema:
          type: string
          enum:
          - csv
      responses:
        '200':
          description: Data laporan
