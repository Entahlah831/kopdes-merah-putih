# Template konfigurasi Prometheus untuk Kopdes Merah Putih.
# Render dengan envsubst sebelum dijalankan agar target port & token sinkron dengan .env:
#   envsubst < docs/prometheus.example.yml > /tmp/prometheus.yml
# Simpan nilai METRICS_TOKEN pada /etc/prometheus/metrics_token (chmod 600).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kopdes_api'
    metrics_path: '/metrics'
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['api:${METRICS_PORT}']
        labels:
          service: 'kopdes-merah-putih-api'
          environment: '${APP_ENV}'
