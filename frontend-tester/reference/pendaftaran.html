<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Referensi Pendaftaran &amp; KYC — Kopdes Merah Putih</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; margin: 16px; color: #111; background: #fff; }
    fieldset { margin: 12px 0; padding: 10px 14px; border: 1px solid #999; }
    pre { border: 1px solid #ccc; padding: 8px; overflow-x: auto; font-size: 12px; }
    label { display: block; margin: 6px 0; }
  </style>
</head>
<body>
  <h1>Referensi Formulir Pendaftaran Anggota &amp; Validasi KYC</h1>
  <p><a href="index.html">Daftar Referensi</a> | <a href="../index.html">Tester Utama</a></p>
  <div id="regLimitsInfo" role="status">Memuat batas unggahan dari /api/v1/public/config...</div>

  <fieldset>
    <legend>1. Pratinjau Penyamaran NIK &amp; Validasi Berkas KYC Sisi Klien</legend>
    <label>Contoh NIK (hanya disamarkan di memori, tidak disimpan): <input type="text" id="refNikInput" maxlength="16" value="3201010101900001"></label>
    <p>Pratinjau <code>nik_masked</code>: <strong id="refNikMasked">-</strong></p>
    <label>Pilih File KTP (MIME &amp; Batas Ukuran dari Server): <input type="file" id="refKycFileInput"></label>
    <label>Jenis Dokumen: <select id="refKycDocType"></select></label>
    <p id="refFileValidationMsg" role="status">Belum ada berkas dipilih.</p>
    <pre id="refKycInfoPre">{}</pre>
  </fieldset>

  <script>
    (function () {
      "use strict";
      let pubCfg = null;
      function maskNik(raw) {
        const d = String(raw || "").replace(/\D/g, "");
        return d.length >= 8 ? d.slice(0, 4) + "*".repeat(d.length - 8) + d.slice(-4) : "****************";
      }
      function updateMask() {
        document.getElementById("refNikMasked").textContent = maskNik(document.getElementById("refNikInput").value);
      }
      async function boot() {
        const cfg = await (await fetch("/config.json", { cache: "no-store" })).json();
        const apiBase = String(cfg.api_public_url || "").replace(/\/+$/, "");
        const pub = await (await fetch(apiBase + "/api/v1/public/config")).json();
        pubCfg = pub.data;
        const limits = pubCfg.upload_limits;
        document.getElementById("regLimitsInfo").textContent =
          "Maks KYC: " + (limits.max_kyc_upload_bytes / (1024 * 1024)).toFixed(1) + " MB | MIME: " + limits.allowed_mime_types.join(", ") +
          " | Pendaftaran aktif: " + pubCfg.features.registration_enabled;
        document.getElementById("refKycFileInput").setAttribute("accept", limits.allowed_mime_types.join(","));
        const sel = document.getElementById("refKycDocType");
        for (const t of pubCfg.kyc_supported_document_types || ["ktp"]) {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = (pubCfg.kyc_required_document_types || []).includes(t) ? t + " (wajib)" : t;
          sel.appendChild(opt);
        }
        document.getElementById("refKycInfoPre").textContent = JSON.stringify({
          upload_limits: limits,
          kyc_required_document_types: pubCfg.kyc_required_document_types,
          kyc_supported_document_types: pubCfg.kyc_supported_document_types
        }, null, 2);
      }
      document.getElementById("refNikInput").addEventListener("input", updateMask);
      document.getElementById("refKycFileInput").addEventListener("change", function (ev) {
        const f = ev.target.files && ev.target.files[0];
        const out = document.getElementById("refFileValidationMsg");
        if (!f || !pubCfg) return;
        const limits = pubCfg.upload_limits;
        if (!limits.allowed_mime_types.includes(f.type)) {
          out.textContent = "DITOLAK: Tipe MIME '" + (f.type || "unknown") + "' tidak diizinkan.";
          return;
        }
        if (f.size > limits.max_kyc_upload_bytes) {
          out.textContent = "PERLU KOMPRESI: Ukuran " + f.size + " byte melebihi max_kyc_upload_bytes (" + limits.max_kyc_upload_bytes + ").";
          return;
        }
        out.textContent = "VALID: " + f.name + " (" + f.type + ", " + f.size + " byte). Siap unggah lewat FormData.";
      });
      updateMask();
      boot();
    })();
  </script>
</body>
</html>
